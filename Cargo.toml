[package]
name = "equill"
version = "0.2.6"
edition = "2024"
rust-version = "1.88"
description = "Local-first typed records and reproducible context assembly"
repository = "https://github.com/skopanev/equill"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std"] }
jsonschema = { version = "0.51", default-features = false }
qdrant-client = { version = "=1.19.0", default-features = false, features = ["serde", "uuid"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
secrets_scanner = { version = "=0.2.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
serde_json = "1.0"
sha2 = "0.11"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
toml = "0.8"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["tls-native-roots", "tls-ring", "transport"] }
uuid = { version = "1.25", features = ["serde", "v5", "v7"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
