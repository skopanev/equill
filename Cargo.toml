[package]
name = "equill"
version = "0.2.36"
edition = "2024"
rust-version = "1.88"
description = "Local-first typed records and reproducible context assembly"
repository = "https://github.com/skopanev/equill"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
libc = "0.2.189"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
jsonschema = { version = "0.57.0", default-features = false }
regex = "1.13.1"
qdrant-client = { version = "=1.19.0", default-features = false, features = ["serde", "uuid"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
secrets_scanner = { version = "=0.2.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
tiktoken-rs = "=0.12.1"
toml = "1.1.6"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["tls-native-roots", "tls-ring", "transport"] }
ureq = { version = "=3.4.2", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.26.1", features = ["serde", "v5", "v7"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

# One target rather than another top-level file: the directory cap counts
# files, and a test that needs its own fixture, its own observation helpers and
# three groups of assertions is four files however it is spelled.
[[test]]
name = "read_only_actor"
path = "tests/readonly/main.rs"

[[test]]
name = "idempotency"
path = "tests/writer/idempotency.rs"

[[test]]
name = "import_batch_release"
path = "tests/writer/import_release.rs"

[[test]]
name = "audit_requests"
path = "tests/audit/main.rs"

[[test]]
name = "layout"
path = "tests/layout/main.rs"
