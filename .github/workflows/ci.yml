name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: LOC250
        shell: bash
        run: |
          bad="$(find . -path './target' -prune -o -type f -name '*.rs' -exec awk 'END { if (NR > 250) print FILENAME ":" NR }' {} \;)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Source directory size
        shell: bash
        run: |
          bad="$(find src -type f -name '*.rs' | awk 'BEGIN { FS="/" } { $NF=""; count[$0]++ } END { for (dir in count) if (count[dir] > 10) print dir ":" count[dir] }')"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
